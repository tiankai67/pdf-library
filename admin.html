<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 · 书库</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6v20"></path><path d="M6 12H2v8a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-8h-4"></path><path d="M14 6V3a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1v3"></path></svg>
      管理后台
    </h1>
    <div class="links"><a href="index.html">← 返回书架</a></div>
  </header>

  <main class="admin-wrap">
    <!-- 登录 -->
    <section class="panel" id="login-panel">
      <h2>管理员验证</h2>
      <div class="field">
        <label>管理密码</label>
        <input type="password" id="pw-input" placeholder="请输入管理密码" autocomplete="current-password">
      </div>
      <button class="btn-primary" id="pw-btn">进入后台</button>
      <p class="locked-note" id="pw-hint"></p>
    </section>

    <!-- 上传 -->
    <section class="panel" id="upload-panel" style="display:none;">
      <h2>上传新书</h2>
      <div class="field">
        <label>选择 PDF 文件</label>
        <input type="file" id="pdf-file" accept="application/pdf">
        <div class="upload-hint">选择后系统会自动提取首页作为封面，新书默认排在书架最前</div>
      </div>
      <div class="field">
        <label>书名</label>
        <input type="text" id="title-input" placeholder="默认取文件名（可修改）">
      </div>
      <div>
        <img id="cover-preview" class="preview-cover" alt="封面预览" style="display:none;">
      </div>
      <div style="margin-top:16px;">
        <button class="btn-primary" id="upload-btn" disabled>上传到书架</button>
        <span id="upload-status" style="margin-left:12px; font-size:13px; color:#9c8470;"></span>
      </div>
    </section>

    <!-- 排序 + 列表 -->
    <section class="panel" id="list-panel" style="display:none;">
      <div class="panel-head">
        <h2 style="margin:0;">图书管理 · 书架排序</h2>
        <div class="sort-tools">
          <span class="tool-label">一键排序</span>
          <button class="chip" data-sort="new">最新在前</button>
          <button class="chip" data-sort="old">最早在前</button>
          <button class="chip" data-sort="title">按书名</button>
          <button class="chip" data-sort="pages">按页数</button>
          <button class="chip" data-sort="reverse">反转</button>
        </div>
      </div>
      <p class="locked-note" style="margin:0 0 12px;">
        拖动条目可自由调整顺序，也可用右侧 ↑ ↓ 微调；调整后点「保存顺序」生效到前台书架。
      </p>

      <ul class="admin-list" id="admin-list"></ul>
      <p id="list-empty" class="locked-note" style="display:none;">还没有图书，快上传第一本吧。</p>

      <div class="order-bar" id="order-bar" style="display:none;">
        <span class="dirty-tip" id="dirty-tip">顺序已改动，尚未保存</span>
        <button class="btn-primary" id="save-order-btn">保存顺序</button>
        <button class="btn-primary btn-ghost" id="reset-order-btn">撤销改动</button>
      </div>
    </section>

    <!-- 修改密码 -->
    <section class="panel" id="pwd-panel" style="display:none;">
      <h2>修改管理密码</h2>
      <div class="field">
        <label>当前密码</label>
        <input type="password" id="old-pw" placeholder="请输入当前密码" autocomplete="current-password">
      </div>
      <div class="field">
        <label>新密码（至少 6 位）</label>
        <input type="password" id="new-pw" placeholder="请输入新密码" autocomplete="new-password">
      </div>
      <div class="field">
        <label>确认新密码</label>
        <input type="password" id="new-pw2" placeholder="请再次输入新密码" autocomplete="new-password">
      </div>
      <button class="btn-primary" id="change-pw-btn">确认修改</button>
      <p class="locked-note" id="pw-change-hint" style="margin-top:10px;">
        密码以加盐哈希方式保存在服务器 data/config.json，不保存明文。修改后需重新登录。
      </p>
    </section>
  </main>

  <div id="msg" class="msg"></div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const ADMIN_PW_KEY = 'pdf_lib_admin_pw';
    let adminPw = sessionStorage.getItem(ADMIN_PW_KEY) || '';
    let pendingFile = null;   // File 对象
    let coverDataUrl = null;  // 首页封面 base64
    let pendingPages = null;  // 页数
    let books = [];           // 当前列表（顺序 = 展示顺序）
    let savedIds = [];        // 上次保存的顺序，用于判断是否改动 / 撤销

    function showMsg(t) {
      const m = document.getElementById('msg');
      m.textContent = t; m.classList.add('show');
      setTimeout(() => m.classList.remove('show'), 2600);
    }
    function $(id) { return document.getElementById(id); }

    /* ---------------- 登录 ---------------- */
    async function tryUnlock() {
      const val = $('pw-input').value;
      const hint = $('pw-hint');
      if (!val) { hint.textContent = '请输入密码'; return; }
      hint.textContent = '验证中…';
      const ok = await verifyPw(val);
      if (!ok) { hint.textContent = '密码错误，请重试'; return; }
      adminPw = val;
      sessionStorage.setItem(ADMIN_PW_KEY, adminPw);
      hint.textContent = '';
      enterBackend();
    }
    async function verifyPw(pw) {
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw }),
        });
        return res.ok;
      } catch (e) { showMsg('无法连接服务器'); return false; }
    }
    $('pw-btn').onclick = tryUnlock;
    $('pw-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });

    function enterBackend() {
      $('login-panel').style.display = 'none';
      $('upload-panel').style.display = 'block';
      $('list-panel').style.display = 'block';
      $('pwd-panel').style.display = 'block';
      loadList();
    }
    function logout(tip) {
      sessionStorage.removeItem(ADMIN_PW_KEY);
      adminPw = '';
      if (tip) showMsg(tip);
      setTimeout(() => location.reload(), 800);
    }
    // 已有会话密码时先静默校验一次，避免改过密码后残留旧会话
    (async () => {
      if (adminPw) {
        if (await verifyPw(adminPw)) enterBackend();
        else sessionStorage.removeItem(ADMIN_PW_KEY);
      }
    })();

    /* ---------------- 选择文件 → 生成封面 ---------------- */
    $('pdf-file').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      const status = $('upload-status');
      const btn = $('upload-btn');
      const preview = $('cover-preview');
      if (!file) { pendingFile = null; btn.disabled = true; return; }
      if (file.type !== 'application/pdf') {
        showMsg('请选择 PDF 文件');
        e.target.value = ''; return;
      }
      pendingFile = file;
      btn.disabled = true;
      status.textContent = '正在提取首页生成封面…';

      if (!$('title-input').value.trim()) {
        $('title-input').value = file.name.replace(/\.pdf$/i, '');
      }

      try {
        const buf = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
        pendingPages = pdf.numPages;
        const page = await pdf.getPage(1);
        const base = page.getViewport({ scale: 1 });
        const scale = 360 / base.width;
        const vp = page.getViewport({ scale });
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(vp.width);
        canvas.height = Math.round(vp.height);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
        coverDataUrl = canvas.toDataURL('image/jpeg', 0.82);
        preview.src = coverDataUrl;
        preview.style.display = 'block';
        status.textContent = `就绪：${pendingPages} 页`;
        btn.disabled = false;
      } catch (err) {
        console.error(err);
        showMsg('封面生成失败：' + (err.message || err));
        status.textContent = '封面生成失败';
        coverDataUrl = null;
      }
    });

    /* ---------------- 上传 ---------------- */
    $('upload-btn').onclick = async () => {
      if (!pendingFile) return;
      const btn = $('upload-btn');
      const status = $('upload-status');
      btn.disabled = true;
      status.textContent = '上传中…';

      const toBase64 = (file) => new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result.split(',')[1]);
        r.onerror = reject;
        r.readAsDataURL(file);
      });

      try {
        const pdfB64 = await toBase64(pendingFile);
        const payload = {
          title: $('title-input').value.trim() || pendingFile.name,
          pages: pendingPages,
          pdf: pdfB64,
          cover: coverDataUrl ? coverDataUrl.split(',')[1] : null,
        };
        const res = await fetch('/api/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Admin-Password': adminPw },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          if (res.status === 401) { logout('密码已变更，请重新验证'); return; }
          throw new Error(data.error || '上传失败');
        }
        showMsg('上传成功！');
        status.textContent = '上传成功';
        $('pdf-file').value = '';
        $('title-input').value = '';
        $('cover-preview').style.display = 'none';
        pendingFile = null; coverDataUrl = null; pendingPages = null;
        loadList();
      } catch (err) {
        showMsg('上传失败：' + err.message);
        status.textContent = '失败';
      } finally {
        btn.disabled = false;
      }
    };

    /* ---------------- 列表 + 排序 ---------------- */
    async function loadList() {
      try {
        const data = await (await fetch('/api/books')).json();
        books = data.books || [];
        savedIds = books.map((b) => b.id);
        renderList();
      } catch (e) { showMsg('加载列表失败'); }
    }

    function isDirty() {
      const cur = books.map((b) => b.id);
      return cur.length !== savedIds.length || cur.some((id, i) => id !== savedIds[i]);
    }

    function renderList() {
      const ul = $('admin-list');
      ul.innerHTML = '';
      $('list-empty').style.display = books.length ? 'none' : 'block';
      $('order-bar').style.display = books.length ? 'flex' : 'none';

      books.forEach((b, i) => {
        const li = document.createElement('li');
        li.draggable = true;
        li.dataset.id = b.id;
        li.innerHTML = `
          <span class="drag-handle" title="拖动排序">⋮⋮</span>
          <span class="order-no">${i + 1}</span>
          <img src="/covers/${b.id}.jpg" onerror="this.src='/no-cover.svg'">
          <div class="info">
            <b class="book-name" data-rename="${b.id}" title="点击修改书名">${escapeHtml(b.title)}</b>
            <span>${b.pages ? b.pages + ' 页 · ' : ''}${fmtSize(b.size)} · ${fmtDate(b.createdAt)}</span>
          </div>
          <div class="row-actions">
            <button class="mini-btn" data-rename-btn="${b.id}" title="修改书名">✎</button>
            <button class="mini-btn" data-move="up"   ${i === 0 ? 'disabled' : ''} title="上移">↑</button>
            <button class="mini-btn" data-move="down" ${i === books.length - 1 ? 'disabled' : ''} title="下移">↓</button>
            <button class="mini-btn" data-move="top"  ${i === 0 ? 'disabled' : ''} title="置顶">⇈</button>
            <button class="del-btn" data-del="${b.id}">删除</button>
          </div>`;
        ul.appendChild(li);
      });

      // 行内按钮
      ul.querySelectorAll('[data-del]').forEach((btn) => {
        btn.onclick = () => delBook(btn.getAttribute('data-del'));
      });
      // 书名点击 / ✎ 按钮 → 进入内联编辑
      ul.querySelectorAll('[data-rename]').forEach((el) => {
        el.onclick = () => startRename(el.getAttribute('data-rename'));
      });
      ul.querySelectorAll('[data-rename-btn]').forEach((btn) => {
        btn.onclick = () => startRename(btn.getAttribute('data-rename-btn'));
      });
      ul.querySelectorAll('[data-move]').forEach((btn) => {
        btn.onclick = () => {
          const li = btn.closest('li');
          const i = [...ul.children].indexOf(li);
          const dir = btn.getAttribute('data-move');
          if (dir === 'up' && i > 0) swap(i, i - 1);
          else if (dir === 'down' && i < books.length - 1) swap(i, i + 1);
          else if (dir === 'top' && i > 0) { const [x] = books.splice(i, 1); books.unshift(x); renderList(); }
          markDirty();
        };
      });

      bindDrag(ul);
      markDirty();
    }

    function swap(a, b) {
      [books[a], books[b]] = [books[b], books[a]];
      renderList();
    }

    /* ---- 内联修改书名 ---- */
    let renamingId = null;   // 同一时刻只允许编辑一行
    function startRename(id) {
      if (renamingId) return;
      const li = document.querySelector(`#admin-list li[data-id="${id}"]`);
      const nameEl = li && li.querySelector('.book-name');
      const book = books.find((b) => b.id === id);
      if (!li || !nameEl || !book) return;

      renamingId = id;
      li.draggable = false;   // 编辑时禁用拖拽，否则选中文字会误触发拖动

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'rename-input';
      input.value = book.title;
      input.maxLength = 120;
      nameEl.replaceWith(input);
      input.focus();
      input.select();

      let done = false;
      const finish = async (save) => {
        if (done) return;
        done = true;
        const next = input.value.replace(/[\r\n\t]+/g, ' ').trim();
        renamingId = null;
        li.draggable = true;

        if (!save || !next || next === book.title) {
          if (save && !next) showMsg('书名不能为空，已取消修改');
          renderList();
          return;
        }
        input.disabled = true;
        const ok = await saveTitle(id, next);
        if (ok) { book.title = next; showMsg('书名已更新'); }
        renderList();
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); finish(true); }
        else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
      });
      input.addEventListener('blur', () => finish(true));   // 失焦即保存
    }

    async function saveTitle(id, title) {
      try {
        const res = await fetch('/api/book/' + encodeURIComponent(id), {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', 'X-Admin-Password': adminPw },
          body: JSON.stringify({ title }),
        });
        if (res.status === 401) { logout('密码已变更，请重新验证'); return false; }
        const data = await res.json().catch(() => ({}));
        if (!data.ok) throw new Error(data.error || '保存失败');
        return true;
      } catch (err) {
        showMsg('书名修改失败：' + err.message);
        return false;
      }
    }
    function markDirty() {
      const dirty = isDirty();
      $('dirty-tip').style.visibility = dirty ? 'visible' : 'hidden';
      $('save-order-btn').disabled = !dirty;
      $('reset-order-btn').disabled = !dirty;
    }

    /* ---- HTML5 拖拽排序 ---- */
    let dragEl = null;
    function bindDrag(ul) {
      ul.querySelectorAll('li').forEach((li) => {
        li.addEventListener('dragstart', (e) => {
          dragEl = li;
          li.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          try { e.dataTransfer.setData('text/plain', li.dataset.id); } catch (_) {}
        });
        li.addEventListener('dragend', () => {
          li.classList.remove('dragging');
          // 以 DOM 顺序回写数据顺序
          const ids = [...ul.children].map((n) => n.dataset.id);
          books.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
          dragEl = null;
          renderList();
        });
        li.addEventListener('dragover', (e) => {
          e.preventDefault();
          if (!dragEl || dragEl === li) return;
          const rect = li.getBoundingClientRect();
          const after = (e.clientY - rect.top) / rect.height > 0.5;
          ul.insertBefore(dragEl, after ? li.nextSibling : li);
        });
      });
    }

    /* ---- 一键排序 ---- */
    document.querySelectorAll('[data-sort]').forEach((btn) => {
      btn.onclick = () => {
        const mode = btn.getAttribute('data-sort');
        if (mode === 'new') books.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        else if (mode === 'old') books.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
        else if (mode === 'title') books.sort((a, b) => String(a.title).localeCompare(String(b.title), 'zh-Hans-CN', { numeric: true }));
        else if (mode === 'pages') books.sort((a, b) => (b.pages || 0) - (a.pages || 0));
        else if (mode === 'reverse') books.reverse();
        renderList();
      };
    });

    /* ---- 保存 / 撤销 ---- */
    $('save-order-btn').onclick = async () => {
      const btn = $('save-order-btn');
      btn.disabled = true;
      try {
        const res = await fetch('/api/reorder', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Admin-Password': adminPw },
          body: JSON.stringify({ ids: books.map((b) => b.id) }),
        });
        if (res.status === 401) { logout('密码已变更，请重新验证'); return; }
        const data = await res.json().catch(() => ({}));
        if (!data.ok) throw new Error(data.error || '保存失败');
        savedIds = books.map((b) => b.id);
        showMsg('顺序已保存，前台书架已更新');
        markDirty();
      } catch (err) {
        showMsg('保存失败：' + err.message);
        btn.disabled = false;
      }
    };
    $('reset-order-btn').onclick = () => { loadList(); showMsg('已撤销未保存的改动'); };

    /* ---------------- 删除 ---------------- */
    async function delBook(id) {
      if (!confirm('确定删除这本书吗？此操作不可恢复。')) return;
      const res = await fetch('/api/book/' + encodeURIComponent(id), {
        method: 'DELETE',
        headers: { 'X-Admin-Password': adminPw },
      });
      if (res.status === 401) { logout('密码已变更，请重新验证'); return; }
      const data = await res.json().catch(() => ({}));
      if (data.ok) { showMsg('已删除'); loadList(); }
      else showMsg('删除失败：' + (data.error || ''));
    }

    /* ---------------- 修改密码 ---------------- */
    $('change-pw-btn').onclick = async () => {
      const oldPw = $('old-pw').value;
      const p1 = $('new-pw').value;
      const p2 = $('new-pw2').value;
      const hint = $('pw-change-hint');
      if (!oldPw || !p1) { hint.textContent = '请填写当前密码与新密码'; return; }
      if (p1.length < 6) { hint.textContent = '新密码至少 6 位'; return; }
      if (p1 !== p2) { hint.textContent = '两次输入的新密码不一致'; return; }

      const btn = $('change-pw-btn');
      btn.disabled = true; hint.textContent = '提交中…';
      try {
        const res = await fetch('/api/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ oldPassword: oldPw, newPassword: p1 }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) throw new Error(data.error || '修改失败');
        hint.textContent = '密码已修改，正在返回登录…';
        showMsg('密码修改成功，请用新密码重新登录');
        $('old-pw').value = $('new-pw').value = $('new-pw2').value = '';
        logout();
      } catch (err) {
        hint.textContent = '修改失败：' + err.message;
        btn.disabled = false;
      }
    };

    /* ---------------- 工具 ---------------- */
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    function fmtSize(b) {
      if (!b) return '';
      if (b < 1024) return b + ' B';
      if (b < 1048576) return (b/1024).toFixed(0)+' KB';
      return (b/1048576).toFixed(1)+' MB';
    }
    function fmtDate(t) {
      if (!t) return '';
      const d = new Date(t);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
  </script>
</body>
</html>
